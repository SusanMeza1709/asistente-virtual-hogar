services:
  - type: web
    name: asistente-virtual-hogar
    env: python
    plan: free
    rootDir: asistente_virtual_hogar/asistente_virtual_hogar
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asistente-virtual-hogar-db
          property: connectionString

databases:
  - name: asistente-virtual-hogar-db
    plan: free
