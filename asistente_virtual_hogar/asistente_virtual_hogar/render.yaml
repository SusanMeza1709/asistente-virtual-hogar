services:
  - type: web
    name: asistente-virtual-hogar
    env: python
    plan: free
    buildCommand: cd asistente_virtual_hogar/asistente_virtual_hogar && pip install -r requirements.txt
    startCommand: cd asistente_virtual_hogar/asistente_virtual_hogar && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: asistente-virtual-hogar-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: LGTHINQ_API_BASE_URL
        sync: false
      - key: LGTHINQ_API_PAT
        sync: false
      - key: LGTHINQ_WEBHOOK_SECRET
        sync: false
      - key: LGTHINQ_DEFAULT_DEVICE_ID
        sync: false

databases:
  - name: asistente-virtual-hogar-db
    plan: free
