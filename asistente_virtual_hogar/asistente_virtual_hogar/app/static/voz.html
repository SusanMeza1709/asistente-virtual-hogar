<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Virtual de Hogar - Voz</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      max-width: 760px;
      margin-inline: auto;
      line-height: 1.4;
    }
    h1 { margin-top: 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button {
      border: 1px solid #777;
      background: transparent;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #777;
      margin-bottom: 12px;
      font-family: inherit;
    }
    .card {
      border: 1px solid #777;
      border-radius: 10px;
      padding: 12px;
      white-space: pre-wrap;
    }
    .history {
      border: 1px solid #777;
      border-radius: 10px;
      padding: 12px;
      min-height: 140px;
      max-height: 340px;
      overflow-y: auto;
      margin-top: 8px;
      white-space: pre-wrap;
    }
    .history-item { margin-bottom: 10px; }
    .meta { opacity: 0.75; font-size: 12px; }
    .hint { opacity: 0.8; margin-bottom: 10px; }
    .voice-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .voice-row label { white-space: nowrap; }
    .voice-row select { flex: 1; padding: 6px 8px; border-radius: 8px; border: 1px solid #777; font-family: inherit; }
    .voice-row button { padding: 6px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Asistente Virtual de Hogar (Voz)</h1>
  <p class="hint">Haz clic en "Escuchar" y habla. También puedes escribir y enviar manualmente.</p>

  <div class="row">
    <button id="listenBtn">Escuchar</button>
    <button id="stopBtn">Detener</button>
    <button id="sendBtn">Enviar texto</button>
    <button id="repeatBtn">Repetir respuesta</button>
    <button id="clearBtn">Limpiar historial</button>
  </div>

  <div class="voice-row">
    <label for="voiceSelect">Voz:</label>
    <select id="voiceSelect"><option value="">-- cargando voces --</option></select>
    <button id="testVoiceBtn">&#9654; Probar</button>
  </div>

  <label for="userText">Tu mensaje:</label>
  <textarea id="userText" placeholder="Ejemplo: comprar 2 Leche"></textarea>

  <h3>Respuesta</h3>
  <div id="reply" class="card">Aquí aparecerá la respuesta.</div>

  <h3>Historial</h3>
  <div id="history" class="history">Aún no hay conversación.</div>

  <script>
    const listenBtn = document.getElementById('listenBtn');
    const stopBtn = document.getElementById('stopBtn');
    const sendBtn = document.getElementById('sendBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const clearBtn = document.getElementById('clearBtn');
    const userText = document.getElementById('userText');
    const reply = document.getElementById('reply');
    const history = document.getElementById('history');

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const STORAGE_KEY = 'asistente_hogar_historial';
    let recognition = null;
    let lastAssistantReply = '';
    let conversation = [];
    let manualVoiceIndex = null; // null = auto-pick

    function getAllVoices() {
      return (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    }

    function populateVoiceSelector() {
      const sel = document.getElementById('voiceSelect');
      const voices = getAllVoices();
      if (!voices.length) return;
      sel.innerHTML = '';
      voices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        // auto-select best Spanish voice by default
        if (manualVoiceIndex === null && String(v.lang || '').toLowerCase().startsWith('es')) {
          const ranked = ['es-pe','es-mx','es-us','es-ar','es-co','es-cl','es-es'];
          const current = sel.querySelector('option[selected]');
          const curLang = current ? voices[parseInt(current.value)].lang.toLowerCase() : '';
          const newLang = v.lang.toLowerCase();
          const newRank = ranked.findIndex(r => newLang.includes(r));
          const curRank = ranked.findIndex(r => curLang.includes(r));
          if (!current || (newRank !== -1 && (curRank === -1 || newRank < curRank))) {
            opt.selected = true;
          }
        }
        sel.appendChild(opt);
      });
      // if nothing was auto-selected, select first Spanish voice found
      if (!sel.querySelector('option[selected]')) {
        const firstSpanish = voices.findIndex(v => String(v.lang || '').toLowerCase().startsWith('es'));
        if (firstSpanish !== -1) sel.value = firstSpanish;
      }
    }

    function getSelectedVoice() {
      const sel = document.getElementById('voiceSelect');
      const voices = getAllVoices();
      const idx = parseInt(sel.value);
      return (!isNaN(idx) && voices[idx]) ? voices[idx] : null;
    }

    function nowLabel() {
      return new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function saveConversation() {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(conversation));
    }

    function loadConversation() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          conversation = parsed;
        }
      } catch (_) {
        conversation = [];
      }
    }

    function renderHistory() {
      if (!conversation.length) {
        history.textContent = 'Aún no hay conversación.';
        return;
      }

      history.innerHTML = conversation
        .map((item) => {
          return `
            <div class="history-item">
              <div class="meta">${item.time} · ${item.role === 'user' ? 'Tú' : 'Asistente'}</div>
              <div>${item.text}</div>
            </div>
          `;
        })
        .join('');
      history.scrollTop = history.scrollHeight;
    }

    function addHistory(role, text) {
      conversation.push({ role, text, time: nowLabel() });
      saveConversation();
      renderHistory();
    }

    function prepareForSpeech(text) {
      // "0.20" → "20" so TTS says "veinte" not "cero punto veinte cero"
      // Applies to any sub-sol price like "0.20 céntimos" → "20 céntimos"
      return text.replace(/\b0\.(\d{2})\b/g, (_, d) => String(parseInt(d, 10)));
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      const clean = prepareForSpeech(String(text || '').trim());
      if (!clean) return;

      const selectedVoice = getSelectedVoice();

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = selectedVoice?.lang || 'es-PE';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }
      window.speechSynthesis.speak(utterance);
    }

    async function sendMessage(message) {
      const clean = message.trim();
      if (!clean) return;

      addHistory('user', clean);

      reply.textContent = 'Procesando...';
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: clean })
        });

        if (!res.ok) {
          throw new Error('Error al consultar /chat');
        }

        const data = await res.json();
        const text = data.reply || 'No hubo respuesta.';
        lastAssistantReply = text;
        reply.textContent = text;
        addHistory('assistant', text);
        speak(text);
      } catch (error) {
        const failMessage = 'No se pudo obtener respuesta del asistente.';
        lastAssistantReply = failMessage;
        reply.textContent = failMessage;
        addHistory('assistant', failMessage);
      }
    }

    sendBtn.addEventListener('click', () => sendMessage(userText.value));
    repeatBtn.addEventListener('click', () => {
      if (!lastAssistantReply) return;
      speak(lastAssistantReply);
    });
    clearBtn.addEventListener('click', () => {
      conversation = [];
      sessionStorage.removeItem(STORAGE_KEY);
      renderHistory();
      reply.textContent = 'Historial limpiado.';
    });

    document.getElementById('testVoiceBtn').addEventListener('click', () => {
      speak('Hola, prueba de voz en español.');
    });
    document.getElementById('voiceSelect').addEventListener('change', () => {
      manualVoiceIndex = parseInt(document.getElementById('voiceSelect').value);
    });

    loadConversation();
    populateVoiceSelector();
    if (window.speechSynthesis && 'onvoiceschanged' in window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = populateVoiceSelector;
    }
    renderHistory();
    if (conversation.length) {
      const lastAssistant = [...conversation].reverse().find((item) => item.role === 'assistant');
      if (lastAssistant?.text) {
        lastAssistantReply = lastAssistant.text;
      }
    }

    if (Recognition) {
      recognition = new Recognition();
      recognition.lang = 'es-PE';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript || '';
        userText.value = transcript;
        sendMessage(transcript);
      };

      recognition.onerror = () => {
        reply.textContent = 'No se pudo reconocer tu voz. Revisa permisos de micrófono.';
      };

      listenBtn.addEventListener('click', () => recognition.start());
      stopBtn.addEventListener('click', () => recognition.stop());
    } else {
      listenBtn.disabled = true;
      stopBtn.disabled = true;
      reply.textContent = 'Tu navegador no soporta reconocimiento de voz Web Speech API.';
    }
  </script>
</body>
</html>
